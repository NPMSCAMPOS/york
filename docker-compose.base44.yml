services:
  postgres:
    image: postgres:16-alpine
    container_name: york-postgres
    environment:
      POSTGRES_DB: york_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
    ports:
      - "8000:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/york_db
      - PORT=3001
      - JWT_SECRET=base44-dev-jwt-secret-9f3a7c2e1b8d4f6a
      - CORS_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NODE_ENV=development
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
