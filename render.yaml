services:
  - type: web
    name: york
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: CORS_ORIGIN
        value: https://york-snowy.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: york-db
          property: externalConnectionString
    databases:
      - name: york-db
